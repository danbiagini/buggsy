# Buggsy v1 broker config.
#
# Anonymous access allowed on the LAN for first-pass dev simplicity. Before
# exposing outside the home network, switch to a password_file + TLS — tracked
# as a v1 follow-up.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type notice
