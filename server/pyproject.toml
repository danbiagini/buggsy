[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buggsy-server"
version = "0.1.0"
description = "Buggsy server-side services (orchestrator, TTS, config)."
requires-python = ">=3.12"
dependencies = [
    "buggsy-shared",
]

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.hatch.metadata]
allow-direct-references = true
