[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buggsy-server"
version = "0.1.0"
description = "Buggsy server-side services (orchestrator, TTS, config)."
requires-python = ">=3.12"
dependencies = [
    "buggsy-shared",
    "aiomqtt>=2.0",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # For testing the STT FastAPI app via TestClient. Not a server
    # runtime dep — fastapi lives in server/stt/requirements.txt.
    "fastapi>=0.110",
]

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
