[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buggsy-robot"
version = "0.1.0"
description = "Buggsy agent that runs on the Reachy Mini Wireless."
requires-python = ">=3.12"
dependencies = [
    "buggsy-shared",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "openwakeword>=0.6",
    "aiomqtt>=2.0",
]

[project.optional-dependencies]
# Speex noise suppression for openWakeWord — optional, helps in noisy rooms.
# Install with: pip install -e robot/[speex]
speex = ["speexdsp-ns"]
# Dev/test tooling — install with: pip install pytest pytest-asyncio
# (the install.sh wrapper script doesn't pull extras; tests run on dev mac.)
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/robot"]

[tool.hatch.metadata]
# Allow direct local path deps during development.
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
